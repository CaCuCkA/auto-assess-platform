version: '3.8'

services:
  postgres:
    build:
      context: .
      dockerfile: database/Dockerfile
    container_name: postgres_db
    restart: always
    ports:
      - "${DB_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    env_file:
      - .env
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend_service
    ports:
      - "${BACKEND_PORT}:5000"
    env_file:
      - .env
    depends_on:
      - postgres
    networks:
      - app_network
    volumes:
      - sharepoint:${BACKEND_SHAREPOINT_PATH} 

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: frontend_service
    ports:
      - "${FRONTEND_PORT}:3000"
    env_file:
      - .env
    depends_on:
      - postgres
      - backend
    networks:
      - app_network

  jenkins:
    build:
      context: .
      dockerfile: jenkins/Dockerfile
    container_name: jenkins_server
    ports:
      - "${JENKINS_PORT}:8080"
      - "${JENKINS_AGENT_PORT}:50000"
    environment:
      JENKINS_USER: ${JENKINS_USER}
      JENKINS_PASSWORD: ${JENKINS_PASSWORD}
      BACKEND_HOST: ${BACKEND_HOST}
      BACKEND_PORT: ${BACKEND_PORT}
    user: root
    volumes:
      - sharepoint:${JENKINS_SHAREPOINT_PATH}
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - backend
    networks:
      - app_network
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:8080/login || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  sharepoint:

networks:
  app_network:
    driver: bridge
